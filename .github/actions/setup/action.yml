name: "Setup viur-ui"
description: "Node (.nvmrc) + pnpm install for the workspace (root and example/)"

runs:
  using: "composite"
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"

    - name: Install dependencies (root + example/ for histoire aliases)
      shell: bash
      run: pnpm install --frozen-lockfile
